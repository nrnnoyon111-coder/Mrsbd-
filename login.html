<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · MRS FAST SOLUTIONS</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"><link rel="stylesheet" href="style.css"></head><body class="lg"><form class="glass" id="f"><div class="brand"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#ffd21f"/></svg><h2>MRS FAST SOLUTIONS</h2></div><p class="mut">Admin sign in. Internal use only.</p><label>Email<input type="email" id="e" required autocomplete="username"></label><label>Password<input type="password" id="p" required autocomplete="current-password"></label><div class="err" id="er" role="alert"></div><button class="btn">Sign in</button><a href="index.html" class="mut">Back to company page</a></form>
